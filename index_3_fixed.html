                weekday: parseFloat(document.getElementById('rate_mgr_weekday').value) || 0,
                weekend: parseFloat(document.getElementById('rate_mgr_weekend').value) || 0,
                publicHoliday: parseFloat(document.getElementById('rate_mgr_ph').value) || 0,
            };
            settingsCache.rates.staff = {
                weekday: parseFloat(document.getElementById('rate_staff_weekday').value) || 0,
                weekend: parseFloat(document.getElementById('rate_staff_weekend').value) || 0,
                publicHoliday: parseFloat(document.getElementById('rate_staff_ph').value) || 0,
            };
            const newPin = document.getElementById('newAdminPin').value.trim();
            if (newPin) {
                if (newPin.length < 4) { showToast('⚠️ PIN must be at least 4 digits', 'error'); return; }
                settingsCache.adminPin = newPin;
            }
            saveSettings();
            closeModal();
            showToast('✅ Settings saved', 'success');
            renderAdminReport();
        }

        // ---------- Public holiday management ----------
        function openPublicHolidayModal() {
            requireAdmin(() => renderPublicHolidayModal());
        }

        function renderPublicHolidayModal() {
            const list = (settingsCache.publicHolidays || []).slice().sort();
            const rows = list.map(d => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--gray-100);">
                    <span>${d}</span>
                    <button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem;" onclick="removePublicHoliday('${d}')">Delete</button>
                </div>
            `).join('') || '<p style="color:var(--gray-400);font-size:0.85rem;">No public holidays yet</p>';

            const html = `
                <button class="modal-close" onclick="closeModal()">✕</button>
                <h3 style="text-align:center;">🎉 Public Holidays</h3>
                <div style="display:flex;gap:8px;margin:14px 0;">
                    <input type="date" id="newPhDate" style="flex:1;padding:8px;border:1px solid var(--gray-200);border-radius:6px;">
                    <button class="btn btn-primary" onclick="addPublicHoliday()">➕ Add</button>
                </div>
                <div style="max-height:260px;overflow-y:auto;">${rows}</div>
                <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:14px;" onclick="closeModal()">Close</button>
            `;
            openModal(html);
        }

        function addPublicHoliday() {
            const val = document.getElementById('newPhDate').value;
            if (!val) return;
            if (!settingsCache.publicHolidays.includes(val)) {
                settingsCache.publicHolidays.push(val);
                saveSettings();
                showToast('✅ Public holiday added', 'success');
            }
            renderPublicHolidayModal();
            renderAdminReport();
        }

        function removePublicHoliday(dateStr) {
            settingsCache.publicHolidays = settingsCache.publicHolidays.filter(d => d !== dateStr);
            saveSettings();
            renderPublicHolidayModal();
            renderAdminReport();
        }

        // ---------- Revenue entry ----------
        function openRevenueModal(presetType, presetLabel) {
            requireAdmin(() => renderRevenueModal(presetType, presetLabel));
        }

        function renderRevenueModal(presetType, presetLabel) {
            presetType = presetType === 'month' ? 'month' : 'week';
            const existing = presetLabel ? settingsCache.revenueEntries.find(r => r.type === presetType && r.label === presetLabel) : null;
            const list = settingsCache.revenueEntries.slice().sort((a, b) => b.label.localeCompare(a.label));
            const rows = list.map(r => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--gray-100);font-size:0.8rem;gap:6px;">
                    <span>${r.type === 'week' ? '📅 Week ' : '🗓️ Month '}${r.label}</span>
                    <span style="font-weight:700;">$${Number(r.amount).toLocaleString()}</span>
                    <button class="btn btn-danger" style="padding:3px 8px;font-size:0.72rem;" onclick="removeRevenueEntry('${r.type}','${r.label}')">Delete</button>
                </div>
            `).join('') || '<p style="color:var(--gray-400);font-size:0.85rem;">No revenue data yet</p>';

            const html = `
                <button class="modal-close" onclick="closeModal()">✕</button>
                <h3 style="text-align:center;">💰 Enter Revenue</h3>
                <div style="margin:14px 0;">
                    <div style="display:flex;gap:8px;margin-bottom:8px;">
                        <select id="revType" onchange="onRevenueTypeChange()" style="padding:8px;border:1px solid var(--gray-200);border-radius:6px;">
                            <option value="week" ${presetType === 'week' ? 'selected' : ''}>By Week</option>
                            <option value="month" ${presetType === 'month' ? 'selected' : ''}>By Month</option>
                        </select>
                        <input type="${presetType === 'week' ? 'week' : 'month'}" id="revPeriodInput" value="${presetLabel || ''}" style="flex:1;padding:8px;border:1px solid var(--gray-200);border-radius:6px;">
                    </div>
                    <input type="number" step="0.01" min="0" id="revAmount" placeholder="Revenue ($)" value="${existing ? existing.amount : ''}" style="width:100%;padding:8px;border:1px solid var(--gray-200);border-radius:6px;box-sizing:border-box;">
                    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px;" onclick="saveRevenueEntry()">💾 Save</button>
                </div>
                <div style="max-height:220px;overflow-y:auto;border-top:1px solid var(--gray-100);padding-top:8px;">${rows}</div>
            `;
            openModal(html);
        }

        function onRevenueTypeChange() {
            const type = document.getElementById('revType').value;
            const input = document.getElementById('revPeriodInput');
            input.type = type === 'week' ? 'week' : 'month';
            input.value = '';
        }

        function saveRevenueEntry() {
            const type = document.getElementById('revType').value;
            const label = document.getElementById('revPeriodInput').value;
            const amount = parseFloat(document.getElementById('revAmount').value);
            if (!label || isNaN(amount) || amount < 0) {
                showToast('⚠️ Please fill in all fields', 'error');
                return;
            }
            settingsCache.revenueEntries = settingsCache.revenueEntries.filter(r => !(r.type === type && r.label === label));
            settingsCache.revenueEntries.push({ type, label, amount });
            saveSettings();
            showToast('✅ Revenue saved', 'success');
            renderRevenueModal(type, label);
            renderAdminReport();
        }

        function removeRevenueEntry(type, label) {
            settingsCache.revenueEntries = settingsCache.revenueEntries.filter(r => !(r.type === type && r.label === label));
            saveSettings();
            renderRevenueModal(type, null);
            renderAdminReport();
        }

        // ---------- Hours & wage report ----------
        function onReportPeriodTypeChange() {
            const type = document.getElementById('reportPeriodType').value;
            const input = document.getElementById('reportDateInput');
            input.type = type === 'day' ? 'date' : (type === 'week' ? 'week' : 'month');
            input.value = '';
            document.getElementById('adminReportResult').innerHTML = '';
        }

        function renderAdminReport() {
            const typeEl = document.getElementById('reportPeriodType');
            const dateEl = document.getElementById('reportDateInput');
            const resultEl = document.getElementById('adminReportResult');
            if (!typeEl || !dateEl || !resultEl) return;

            const periodType = typeEl.value;
            const val = dateEl.value;
            if (!val) { resultEl.innerHTML = ''; return; }

            let range, periodLabel;
            if (periodType === 'day') {
                range = { start: val, end: val };
                periodLabel = val;
            } else if (periodType === 'week') {
                range = isoWeekToRange(val);
                periodLabel = val;
            } else {
                range = monthToRange(val);
                periodLabel = val;
            }

            const employees = getEmployees();
            let totalWage = 0;
            const rows = employees.map(emp => {
                const stats = computeEmployeeStats(emp, range);
                const wage = computeEmployeeWage(emp, stats);
                totalWage += wage;
                return `
                    <tr>
                        <td style="text-align:left;font-weight:600;">${emp.name}<br><span style="font-size:0.68rem;color:var(--gray-400);">${getRoleLabel(getEmployeeRole(emp))}</span></td>
                        <td>${formatHoursDecimal(stats.weekdayMin)}</td>
                        <td>${formatHoursDecimal(stats.weekendMin)}</td>
                        <td>${formatHoursDecimal(stats.phMin)}</td>
                        <td style="font-weight:700;">${formatHoursDecimal(stats.totalMin)}</td>
                        <td style="font-weight:700;">$${wage.toFixed(2)}</td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="6" style="color:var(--gray-400);">No employees yet</td></tr>';

            const totalWithSuper = totalWage * 1.12;

            let revenueHtml = '';
            if (periodType !== 'day') {
                const rev = settingsCache.revenueEntries.find(r => r.type === periodType && r.label === periodLabel);
                if (rev) {
                    const pct = rev.amount > 0 ? (totalWithSuper / rev.amount * 100) : 0;
                    revenueHtml = `
                        <div class="weekly-summary-cards" style="margin-top:14px;">
                            <div class="summary-card total">
                                <div class="label">💰 Revenue this period</div>
                                <div class="value">$${Number(rev.amount).toLocaleString()}</div>
                            </div>
                            <div class="summary-card sat">
                                <div class="label">👥 Labour (wages + 12% super)</div>
                                <div class="value">$${totalWithSuper.toFixed(2)}</div>
                            </div>
                            <div class="summary-card sun">
                                <div class="label">📊 Labour % / Revenue</div>
                                <div class="value">${pct.toFixed(1)}%</div>
                            </div>
                        </div>
                    `;
                } else {
                    revenueHtml = `
                        <div style="background:var(--warning-light);padding:10px 12px;border-radius:8px;font-size:0.8rem;color:#92400e;margin-top:12px;">
                            ⚠️ No revenue entered for period ${periodLabel}.
                            <a href="#" onclick="event.preventDefault();openRevenueModal('${periodType}','${periodLabel}')" style="color:#92400e;text-decoration:underline;">Enter now</a>
                        </div>
                    `;
                }
            }

            resultEl.innerHTML = `
                <table class="weekly-table" style="margin-top:14px;">
                    <thead><tr><th style="text-align:left;">Employee</th><th>Weekday</th><th>Weekend</th><th>PH</th><th>Total Hours</th><th>Wage</th></tr></thead>
                    <tbody>
                        ${rows}
                        <tr class="total-row"><td style="text-align:left;">TOTAL</td><td colspan="3"></td><td></td><td>$${totalWage.toFixed(2)}</td></tr>
                    </tbody>
                </table>
                ${revenueHtml}
            `;
        }

        function switchTab(tabName) {
            const dashboardSection = document.getElementById('dashboard-section');
            const addSection = document.getElementById('add-section');
            const adminSection = document.getElementById('admin-section');
            const tabDashboard = document.getElementById('tab-dashboard');
            const tabAdd = document.getElementById('tab-add');
            const tabAdmin = document.getElementById('tab-admin');

            dashboardSection.style.display = 'none';
            addSection.style.display = 'none';
            adminSection.style.display = 'none';
            tabDashboard.classList.remove('active');
            tabAdd.classList.remove('active');
            tabAdmin.classList.remove('active');

            if (tabName === 'dashboard') {
                dashboardSection.style.display = 'block';
                tabDashboard.classList.add('active');
                renderDashboard();
            } else if (tabName === 'add') {
                addSection.style.display = 'block';
                tabAdd.classList.add('active');
                renderEmployeeListMini();
                document.getElementById('empName').focus();
            } else if (tabName === 'admin') {
                adminSection.style.display = 'block';
                tabAdmin.classList.add('active');
                renderAdminSection();
            }
        }

        // ===================== AUTO REFRESH CLOCK =====================
        function startAutoRefresh() {
            setInterval(() => {
                // Refresh dashboard statuses and clock displays
                const clockTime = document.querySelector('.clock-display .time');
                if (clockTime) {
                    clockTime.textContent = getCurrentTime();
                }
                // Refresh dashboard every 30 seconds
                const now = new Date();
                if (now.getSeconds() === 0 || now.getSeconds() === 30) {
                    renderDashboard();
                }
            }, 1000);
        }

        // ===================== INITIALIZATION =====================
        let appStarted = false;
        function init() {
            renderDashboard();
            renderEmployeeListMini();
            if (appStarted) return;
            appStarted = true;
            startAutoRefresh();

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
                if (e.key === 'd' && e.ctrlKey) {
                    e.preventDefault();
                    switchTab('dashboard');
                }
            });
        }

        // App now starts from the Firestore onSnapshot listener above,
        // once the first snapshot (local cache or server) arrives.
    </script>
</body>
</html>
